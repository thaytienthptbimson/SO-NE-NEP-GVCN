<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sổ nề nếp &amp; thi đua lớp chủ nhiệm</title>
<meta name="theme-color" content="#3A2A9E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ Bảng màu & token ============ */
:root{
  --font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  --bg:#F3F1FB; --card:#FFFFFF; --ink:#1D1B3A; --ink2:#524F78; --mute:#8581A8;
  --line:#E5E2F4; --line2:#CFCBE8; --th:#F0EDFB;
  --brand:#5B3FD9; --brand2:#8460FF; --brand-d:#2B1D7A; --brand-l:#EEEAFF;
  --glow1:rgba(132,96,255,.20); --glow2:rgba(236,72,153,.10);
  --glass:rgba(255,255,255,.78);
  --tot:#15803D; --tot-bg:#DCFCE7; --tot-c:#22A559;
  --kha:#1D4ED8; --kha-bg:#DBEAFE; --kha-c:#3B82F6;
  --tb:#A15207; --tb-bg:#FEF3C7; --tb-c:#F59E0B;
  --yeu:#B91C1C; --yeu-bg:#FEE2E2; --yeu-c:#EF4444;
  --tru-bg:#FFF5F5; --cong-bg:#F2FCF5;
  --shadow:0 1px 2px rgba(60,40,160,.06),0 10px 28px -12px rgba(60,40,160,.28);
  --shadow-s:0 1px 3px rgba(60,40,160,.14);
  --h1:36px;
}
[data-theme=dark]{
  --bg:#14122B; --card:#1E1B3F; --ink:#EEEDFB; --ink2:#B7B3DD; --mute:#8F8BBA;
  --line:#322E62; --line2:#443F7C; --th:#272352;
  --brand:#9B82FF; --brand2:#B39DFF; --brand-d:#120E3A; --brand-l:#2C2766;
  --glow1:rgba(132,96,255,.22); --glow2:rgba(236,72,153,.08);
  --glass:rgba(30,27,63,.80);
  --tot:#6EE7A0; --tot-bg:#143B27; --kha:#93C5FD; --kha-bg:#172B57;
  --tb:#FCD34D; --tb-bg:#43300F; --yeu:#FCA5A5; --yeu-bg:#4A1B22;
  --tru-bg:#2A1B2F; --cong-bg:#17302A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -12px rgba(0,0,0,.6);
  --shadow-s:0 1px 3px rgba(0,0,0,.4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:var(--font);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(900px 520px at 8% -8%,var(--glow1),transparent 62%),radial-gradient(760px 480px at 100% 0%,var(--glow2),transparent 58%)}
h1,h2,h3,h4{margin:0;line-height:1.25}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid rgba(132,96,255,.55);outline-offset:2px}
.muted{color:var(--mute)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{width:20px;height:20px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ============ Khung ứng dụng ============ */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100dvh}
.side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:18px;padding:22px 16px;color:#fff;background:linear-gradient(185deg,#2B1D7A 0%,#3A2A9E 55%,#5B3FD9 100%)}
.brand{display:flex;align-items:center;gap:12px;padding:0 6px}
.brand .logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.22)}
.brand b{display:block;font-size:18px;font-weight:800;letter-spacing:-.2px}
.brand small{display:block;opacity:.75;font-size:12.5px}
.side nav{display:flex;flex-direction:column;gap:4px}
.nav{display:flex;align-items:center;gap:12px;min-height:46px;padding:0 14px;border:0;border-radius:14px;background:transparent;color:rgba(255,255,255,.82);font:600 14.5px var(--font);cursor:pointer;text-align:left;transition:background .15s}
.nav:hover{background:rgba(255,255,255,.1)}
.nav.on{background:#fff;color:var(--brand-d);box-shadow:0 8px 20px -10px rgba(0,0,0,.5)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side-foot .btn{justify-content:flex-start;background:rgba(255,255,255,.12);color:#fff}
.side-foot .btn:hover{background:rgba(255,255,255,.2)}
.main-col{min-width:0}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:12px 28px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar .ttl{font-size:20px;font-weight:800;letter-spacing:-.3px;white-space:nowrap}
.topbar .meta{display:flex;gap:6px;flex-wrap:wrap;min-width:0;flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;background:var(--brand-l);color:var(--brand);font:600 12.5px var(--font);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.saved{font:600 12px var(--font);color:var(--tot);opacity:0;transition:opacity .3s;white-space:nowrap}
.saved.show{opacity:1}
.main{padding:22px 28px 64px;max-width:1500px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-head h2{font-size:24px;font-weight:800;letter-spacing:-.4px}
.page-head p{margin:2px 0 0;color:var(--ink2);font-size:14px}
.bottom-nav{display:none}

/* ============ Thành phần chung ============ */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.card+.card,.stack>*+*{margin-top:16px}
.card h3{font-size:16.5px;font-weight:700;letter-spacing:-.2px}
.card .sub{color:var(--ink2);font-size:13.5px;margin:2px 0 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.sb{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border:0;border-radius:12px;font:600 14px var(--font);cursor:pointer;background:var(--brand-l);color:var(--brand);transition:transform .12s,box-shadow .15s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--brand) 0%,var(--brand2) 100%);color:#fff;box-shadow:0 10px 20px -10px rgba(91,63,217,.9)}
.btn.ghost{background:transparent;border:1.5px solid var(--line2);color:var(--ink)}
.btn.dng{background:var(--yeu-bg);color:var(--yeu)}
.btn.ok{background:var(--tot-bg);color:var(--tot)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border:0;border-radius:12px;background:transparent;color:var(--ink2);cursor:pointer}
.icon-btn:hover{background:var(--brand-l);color:var(--brand)}
.inp,select.inp,textarea.inp{font:500 15px var(--font);width:100%;min-height:44px;padding:9px 12px;border:1.5px solid var(--line2);border-radius:12px;background:var(--card);color:var(--ink)}
textarea.inp{resize:vertical;min-height:110px}
.inp:focus{outline:none;border-color:var(--brand2);box-shadow:0 0 0 4px rgba(132,96,255,.2)}
label.f{display:flex;flex-direction:column;gap:5px;font:600 13px var(--font);color:var(--ink2)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.seg{display:inline-flex;gap:2px;padding:4px;border-radius:14px;background:var(--brand-l);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;border-radius:10px;padding:0 14px;min-height:38px;font:600 13.5px var(--font);color:var(--ink2);cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow-s)}
.badge{display:inline-flex;align-items:center;padding:1px 10px;border-radius:999px;font:700 12px/1.7 var(--font);white-space:nowrap}
.badge.tot{background:var(--tot-bg);color:var(--tot)}
.badge.kha{background:var(--kha-bg);color:var(--kha)}
.badge.tb{background:var(--tb-bg);color:var(--tb)}
.badge.yeu{background:var(--yeu-bg);color:var(--yeu)}
.badge.none{background:var(--th);color:var(--mute)}
.badge.warn{background:var(--tb-bg);color:var(--tb)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:14px 16px;border-radius:16px;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow)}
.kpi small{display:block;color:var(--ink2);font-size:13px}
.kpi b{display:block;font-size:26px;font-weight:800;letter-spacing:-.5px;margin-top:2px}
.kpi span{font-size:12.5px;color:var(--mute)}
.empty{text-align:center;padding:42px 20px}
.empty .ill{width:84px;height:84px;margin:0 auto 14px;border-radius:26px;display:grid;place-items:center;background:var(--brand-l);color:var(--brand)}
.empty .ill .ic{width:38px;height:38px}
.empty h3{font-size:20px;margin-bottom:6px}
.empty p{max-width:460px;margin:0 auto 18px;color:var(--ink2)}
.note{padding:10px 14px;border-radius:12px;background:var(--tb-bg);color:var(--tb);font-size:13.5px}
.note.info{background:var(--brand-l);color:var(--brand)}
.hint{font-size:13px;color:var(--mute)}

/* ============ Bảng ============ */
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:16px;background:var(--card);max-height:calc(100dvh - 300px);min-height:160px;-webkit-overflow-scrolling:touch}
.table-wrap.free{max-height:none}
table.grid{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
.grid th,.grid td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:center;vertical-align:middle;background:var(--card)}
.grid th{background:var(--th);font-weight:700;color:var(--ink2);font-size:13px;position:sticky;top:0;z-index:3}
.grid td.l,.grid th.l{text-align:left}
.grid tbody tr:hover td{background:color-mix(in srgb,var(--brand-l) 55%,var(--card))}
.grid .c-stt{width:46px;min-width:46px;position:sticky;left:0;z-index:2;color:var(--mute)}
.grid .c-name{min-width:176px;max-width:240px;position:sticky;left:46px;z-index:2;text-align:left;box-shadow:6px 0 8px -6px rgba(60,40,160,.22);overflow:hidden;text-overflow:ellipsis}
.grid thead .c-stt,.grid thead .c-name{z-index:6}
.grid td.name b{font-weight:600;display:block;overflow:hidden;text-overflow:ellipsis}
.grid td.name small{display:flex;gap:6px;align-items:center;margin-top:1px}
.grid input.cell-in,.grid select.cell-in{font:500 13.5px var(--font);min-height:36px;padding:4px 8px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);width:100%}
.grid input.cell-in:focus,.grid select.cell-in:focus{outline:none;border-color:var(--brand2)}
.pv{display:none}
.num-pos{color:var(--tot);font-weight:700}
.num-neg{color:var(--yeu);font-weight:700}
.tot-cell{font-weight:800;font-size:15px}
.mx thead tr.h1 th{top:0;height:var(--h1)}
.mx thead tr.h2 th{top:var(--h1);vertical-align:top;white-space:normal;min-width:84px;max-width:96px;line-height:1.25;padding:6px 6px}
.mx thead th.g-tru{background:var(--yeu-bg);color:var(--yeu)}
.mx thead th.g-cong{background:var(--tot-bg);color:var(--tot)}
.mx thead tr.h2 th.tru{background:color-mix(in srgb,var(--yeu-bg) 55%,var(--card))}
.mx thead tr.h2 th.cong{background:color-mix(in srgb,var(--tot-bg) 55%,var(--card))}
.mx th .cn{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;font-weight:500;font-size:11.5px;color:var(--ink2);margin-top:2px}
.mx th .cp{display:block;font-weight:800;font-size:13px}
.mx th.tru .cp{color:var(--yeu)} .mx th.cong .cp{color:var(--tot)}
.mx td.cell{padding:4px 6px;min-width:84px}
.mx td.cell.tru{background:var(--tru-bg)}
.mx td.cell.cong{background:var(--cong-bg)}
.cellw{display:flex;align-items:center;justify-content:center;gap:5px}
.tk{width:36px;height:36px;border-radius:10px;border:2px solid var(--line2);background:var(--card);cursor:pointer;display:inline-grid;place-items:center;color:#fff;padding:0;transition:background .15s,border-color .15s}
.tk:hover{border-color:var(--brand2)}
.tk .ic{width:20px;height:20px;stroke-width:3;opacity:0}
.tk.on{border-color:transparent}
.tk.on .ic{opacity:1;animation:pop .24s ease-out}
.cell.tru .tk.on,.sw.tru.on,.crow.tru .tk.on{background:var(--yeu-c)}
.cell.cong .tk.on,.sw.cong.on,.crow.cong .tk.on{background:var(--tot-c)}
@keyframes pop{0%{transform:scale(.3)}65%{transform:scale(1.25)}100%{transform:scale(1)}}
.cnt{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:36px;height:36px;padding:0 4px;border:0;border-radius:10px;background:rgba(80,60,180,.09);cursor:pointer;font:800 11.5px/1.15 var(--font);color:var(--ink)}
.cnt small{font-size:10.5px;font-weight:700}
.cnt.ed{box-shadow:inset 0 0 0 2px var(--brand2)}
.cnt.tru small{color:var(--yeu)} .cnt.cong small{color:var(--tot)}
.cnt.one{font-size:12px}

/* ============ Tuần: thanh chọn ============ */
.toolbar{display:flex;flex-direction:column;gap:12px}
.chips{position:relative;display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity}
.wk{flex:0 0 auto;scroll-snap-align:center;min-width:54px;min-height:54px;padding:4px 8px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;font:700 16px var(--font);position:relative}
.wk small{font:500 10.5px var(--font);color:var(--mute);display:block;min-height:13px}
.wk.on{border-color:transparent;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 10px 18px -10px rgba(91,63,217,.9)}
.wk.on small{color:rgba(255,255,255,.85)}
.wk.done::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--tot-c)}
.wk.on.done::after{background:#fff}
.sumstrip{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sumstrip .st{display:flex;flex-direction:column;padding:8px 14px;border-radius:14px;background:var(--brand-l);min-width:92px}
.sumstrip .st small{font-size:12px;color:var(--ink2)}
.sumstrip .st b{font-size:19px;font-weight:800}
.lock{display:inline-flex;align-items:center;gap:6px}
.searchbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.searchbar .inp{max-width:320px}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:44px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink2)}
.chk input{width:20px;height:20px;accent-color:var(--brand)}

/* ============ Thẻ học sinh (điện thoại) ============ */
.scard{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:10px;overflow:hidden;box-shadow:var(--shadow-s)}
.scard>button.hd{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px 14px;border:0;background:transparent;text-align:left;cursor:pointer}
.scard .no{width:30px;color:var(--mute);font-weight:600;font-size:13px}
.scard .nm{flex:1;min-width:0;font-weight:600}
.scard .nm small{display:block;color:var(--mute);font-weight:500;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scard .sc{font:800 19px var(--font);min-width:44px;text-align:right}
.scard .chev{transition:transform .2s;color:var(--mute)}
.scard.open .chev{transform:rotate(180deg)}
.scard .bd{display:none;border-top:1px solid var(--line)}
.scard.open .bd{display:block}
.sec-t{padding:10px 14px 4px;font:700 13px var(--font);color:var(--ink2)}
.crow{display:flex;align-items:center;gap:12px;padding:8px 14px;border-top:1px solid var(--line);min-height:56px}
.crow .ct{flex:1;min-width:0;font-size:14px;line-height:1.35}
.crow .ct small{display:block;color:var(--mute);font-size:12px}
.crow.on{background:color-mix(in srgb,var(--brand-l) 50%,var(--card))}
.sw{position:relative;width:50px;height:30px;border-radius:999px;border:0;background:var(--line2);cursor:pointer;flex:0 0 auto;transition:background .18s;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .18s}
.sw.on::after{transform:translateX(20px)}
.step{display:inline-flex;align-items:center;background:var(--brand-l);border-radius:12px;flex:0 0 auto}
.step button{width:38px;height:38px;border:0;background:transparent;font:700 20px var(--font);color:var(--brand);cursor:pointer;border-radius:12px}
.step span,.step input{min-width:30px;text-align:center;font-weight:800}
.step input{width:56px;border:0;background:transparent;font:800 16px var(--font);color:var(--ink);height:38px}
input.pts{width:64px;min-height:38px;padding:4px 6px;border:1.5px solid var(--line2);border-radius:10px;background:var(--card);color:var(--ink);font:700 14px var(--font);text-align:center}
.adjrow{display:grid;grid-template-columns:90px 1fr;gap:10px;padding:10px 14px 14px}
.cchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px}
.cchip{flex:0 0 auto;min-height:44px;padding:0 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);cursor:pointer;font:600 13.5px var(--font)}
.cchip.tru b{color:var(--yeu)} .cchip.cong b{color:var(--tot)}
.cchip.on{background:var(--brand-l);border-color:var(--brand2)}
.crow2{display:flex;align-items:center;gap:12px;padding:8px 4px;border-bottom:1px solid var(--line);min-height:56px}
.crow2 .no{width:30px;color:var(--mute);font-size:13px}
.crow2 .nm{flex:1;min-width:0;font-weight:600}
.crow2 .tk{width:44px;height:44px;border-radius:12px}

/* ============ Tổng quan ============ */
.dash{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
.hero{display:grid;grid-template-columns:150px 1fr;gap:20px;align-items:center;background:linear-gradient(140deg,#2B1D7A 0%,#4B34C8 60%,#7C5CFF 100%);color:#fff;border:0;overflow:hidden;position:relative}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%)}
.hero h3{font-size:19px;font-weight:800}
.hero p{margin:4px 0 12px;opacity:.85;font-size:14px}
.ring{position:relative;width:150px;height:150px}
.ring svg{width:150px;height:150px;transform:rotate(-90deg)}
.ring .tr{stroke:rgba(255,255,255,.2)}
.ring .ct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .ct b{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1}
.ring .ct small{opacity:.85;font-size:13px;margin-top:4px}
.hero .btn.pri{background:#fff;color:var(--brand-d);box-shadow:none}
.hero .btn.ghost{border-color:rgba(255,255,255,.5);color:#fff}
.stackbar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:var(--th)}
.stackbar i{display:block;height:100%;min-width:0}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--ink2)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}
.c-tot{--c:var(--tot-c)} .c-kha{--c:var(--kha-c)} .c-tb{--c:var(--tb-c)} .c-yeu{--c:var(--yeu-c)}
.stackbar i.c-tot{background:var(--tot-c)} .stackbar i.c-kha{background:var(--kha-c)} .stackbar i.c-tb{background:var(--tb-c)} .stackbar i.c-yeu{background:var(--yeu-c)}
.list-s{list-style:none;margin:10px 0 0;padding:0}
.list-s li{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.list-s li:first-child{border-top:0}
.list-s .rk{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--brand-l);color:var(--brand);font:700 12px var(--font)}
.list-s .nm{flex:1;min-width:0;font-weight:600}
.list-s .nm small{display:block;font-weight:500;color:var(--mute);font-size:12.5px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}

/* ============ Thống kê / biểu đồ ============ */
.donut-w{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
.donut{width:170px;height:170px;position:relative;flex:0 0 auto}
.donut svg{width:170px;height:170px;transform:rotate(-90deg)}
.donut circle{fill:none;stroke-width:22}
.donut .ct{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.donut .ct b{font-size:26px;font-weight:800;line-height:1}
.donut .ct small{color:var(--mute);font-size:12.5px}
.s-tot{stroke:var(--tot-c)} .s-kha{stroke:var(--kha-c)} .s-tb{stroke:var(--tb-c)} .s-yeu{stroke:var(--yeu-c)} .s-bg{stroke:var(--th)}
table.mini{border-collapse:collapse;font-size:14px;min-width:260px}
table.mini th,table.mini td{padding:7px 12px;border-bottom:1px solid var(--line);text-align:center}
table.mini th:first-child,table.mini td:first-child{text-align:left}
table.mini th{color:var(--ink2);font-size:13px}
.hb{display:grid;grid-template-columns:minmax(120px,38%) 1fr 34px;gap:10px;align-items:center;margin:8px 0;font-size:13.5px}
.hb .lb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .bar{height:14px;border-radius:999px;background:var(--th);overflow:hidden}
.hb .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.hb b{text-align:right}
.chart svg{width:100%;height:auto;display:block}
.chart .ax{stroke:var(--line);stroke-width:1}
.chart .tx{fill:var(--mute);font:500 11px var(--font)}
.chart .ln{fill:none;stroke:var(--brand);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.chart .dt{fill:var(--card);stroke:var(--brand);stroke-width:2.5}
.chart .ar{fill:var(--brand);opacity:.1}
.hkbars .rowb{display:grid;grid-template-columns:76px 1fr;gap:12px;align-items:center;margin:10px 0}
.hkbars .stackbar{height:26px}
.hkbars .stackbar i{display:flex;align-items:center;justify-content:center;color:#fff;font:700 11.5px var(--font)}

/* ============ Modal / Toast ============ */
#modal-root:not(.open){display:none}
.scrim{position:fixed;inset:0;z-index:50;background:rgba(18,12,58,.55);backdrop-filter:blur(2px)}
.dlg{position:fixed;z-index:60;left:50%;top:50%;transform:translate(-50%,-50%);width:min(580px,calc(100vw - 24px));max-height:calc(100dvh - 32px);display:flex;flex-direction:column;background:var(--card);border-radius:24px;box-shadow:0 30px 70px -20px rgba(20,10,80,.6);animation:dlgin .22s ease-out}
.dlg.wide{width:min(860px,calc(100vw - 24px))}
@keyframes dlgin{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 16px 4px 22px}
.dlg-h h3{font-size:18px;font-weight:800}
.dlg-b{padding:8px 22px 14px;overflow:auto}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;padding:12px 22px 18px;border-top:1px solid var(--line)}
.dlg-f .btn.dng{margin-right:auto}
.dlg-b p{margin:6px 0 10px}
.rf{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0}
.step.lg{width:100%;justify-content:space-between}
.step.lg input{flex:1;width:auto}
#toasts{position:fixed;z-index:80;left:0;right:0;bottom:24px;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 12px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;max-width:560px;padding:11px 16px;border-radius:14px;background:#26224F;color:#fff;font-size:14px;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);animation:tin .22s ease-out}
.toast.err{background:#9F1D2C}
.toast.ok .ic{color:#6EE7A0}
.toast button{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:5px 11px;font:700 13px var(--font);cursor:pointer}
@keyframes tin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ============ Danh sách học sinh / cài đặt ============ */
.tbl-edit td.l input{font:500 15px var(--font);width:100%;min-width:200px;min-height:40px;padding:4px 10px;border:1.5px solid transparent;border-radius:10px;background:transparent;color:var(--ink)}
.tbl-edit td.l input:hover{border-color:var(--line2)}
.tbl-edit td.l input:focus{outline:none;border-color:var(--brand2);background:var(--card)}
.imp-opts{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 12px}
.imp-opts label{display:flex;align-items:center;gap:8px;padding:10px 14px;border:1.5px solid var(--line2);border-radius:12px;cursor:pointer;font-weight:600;font-size:14px}
.imp-opts input{accent-color:var(--brand)}
.sticky-sum{position:sticky;top:64px;z-index:10}
.set-sec+.set-sec{margin-top:16px}
.crit-t td,.crit-t th{padding:6px 8px}
.crit-t input[type=text],.crit-t input[type=number],.crit-t select{font:500 13.5px var(--font);width:100%;min-height:38px;padding:4px 8px;border:1.5px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink)}
.crit-t td.l{white-space:normal;min-width:240px}
.menu-list{display:flex;flex-direction:column;gap:6px}
.menu-list .btn{justify-content:flex-start;width:100%}

/* ============ Điện thoại / máy tính bảng nhỏ ============ */
@media (max-width:899px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .topbar{padding:10px 14px}
  .topbar .meta{display:none}
  .topbar .ttl{flex:1;font-size:18px}
  .main{padding:14px 12px calc(96px + env(safe-area-inset-bottom))}
  .page-head h2{font-size:21px}
  .bottom-nav{display:flex;position:fixed;z-index:30;left:0;right:0;bottom:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
  .bottom-nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;border:0;background:transparent;color:var(--mute);font:600 11px var(--font);cursor:pointer;border-radius:14px}
  .bottom-nav button .ic{width:22px;height:22px}
  .bottom-nav button.on{color:var(--brand)}
  .bottom-nav button.on .ico{background:var(--brand-l)}
  .bottom-nav .ico{display:grid;place-items:center;width:52px;height:30px;border-radius:999px;transition:background .15s}
  #toasts{bottom:calc(84px + env(safe-area-inset-bottom))}
  .dash{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr;justify-items:center;text-align:center}
  .hero .row{justify-content:center}
  .table-wrap{max-height:calc(100dvh - 250px)}
  .card{padding:14px;border-radius:18px}
  .dlg{top:auto;bottom:0;left:0;transform:none;width:100%!important;max-height:92dvh;border-radius:24px 24px 0 0;animation:sheet .25s ease-out}
  @keyframes sheet{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .dlg-f{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .rf{grid-template-columns:1fr}
  .donut-w{justify-content:center}
  .hb{grid-template-columns:minmax(90px,40%) 1fr 30px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ============ In ấn ============ */
.print-only{display:none}
@media print{
  html,body{background:#fff!important;color:#000!important}
  body{font-size:11.5px}
  body::before{display:none}
  .side,.topbar,.bottom-nav,#toasts,#modal-root,.no-print,.btn,.seg,.chips,.toolbar,.searchbar,.page-head .row{display:none!important}
  .app{display:block}
  .main{padding:0;max-width:none}
  .print-only{display:block!important}
  .lock-scr,.lic-banner{display:none!important}
  .print-head{text-align:center;margin-bottom:10px;line-height:1.5}
  .print-head .t1{font-weight:700;text-transform:uppercase}
  .print-head .t2{font-size:15px;font-weight:800;margin:6px 0 2px;text-transform:uppercase}
  .print-sign{margin-top:26px;display:flex!important;justify-content:flex-end;text-align:center;page-break-inside:avoid}
  .print-sign div{min-width:240px}
  .print-sign b{display:block;text-transform:uppercase}
  .print-sign .sp{height:70px}
  .card{box-shadow:none;border:0;padding:0;background:#fff}
  .table-wrap{max-height:none!important;overflow:visible!important;border:0;border-radius:0}
  table.grid{font-size:11.5px}
  .grid th,.grid td{border:1px solid #555!important;padding:4px 6px;color:#000!important;background:#fff!important;position:static!important;box-shadow:none!important;white-space:normal}
  .grid th{background:#eee!important}
  thead{display:table-header-group}
  tr{page-break-inside:avoid}
  .badge{border:1px solid #777;background:#fff!important;color:#000!important;padding:0 6px}
  .grid input,.grid select,.grid .hide-print{display:none!important}
  .pv{display:inline!important}
  .num-pos,.num-neg{color:#000!important}
  .kpis,.two,.dash{display:block}
  .kpi{box-shadow:none;border:1px solid #999;margin-bottom:6px}
  .chart svg,.donut svg{max-width:100%}
  .hb .bar{border:1px solid #888}
  .hb .bar i{background:#555!important}
  a{color:#000;text-decoration:none}
  .page-head{display:none!important}
  .hint,.sub{color:#333!important}
  .main{padding:0 !important}
}

/* ---- bổ sung ---- */
.topbar .ttl{min-width:0;overflow:hidden;text-overflow:ellipsis}
.toast{max-width:calc(100vw - 24px)}
.row>.row,.row>.seg,.page-head>.row,.page-head>div{min-width:0;max-width:100%}
.two>.card+.card,.dash>.card+.card{margin-top:0}
.stackbar i{display:flex;align-items:center;justify-content:center;color:#fff;font:700 11.5px var(--font);text-shadow:0 1px 2px rgba(0,0,0,.25)}
.searchbar .inp{width:260px;max-width:100%}
.crit-t input[type=number]{min-width:72px}
.crit-t td.l input[type=text]{min-width:270px}
.crit-t td:nth-child(8) input{min-width:210px}
.crit-t select{min-width:140px}
.crow{flex-wrap:wrap}
.crow .ctl{flex:0 0 100%;display:flex;align-items:center;gap:10px;padding:0 0 4px 62px;flex-wrap:wrap}
.step button:disabled{opacity:.3;cursor:not-allowed}
.crow2.tru .tk.on{background:var(--yeu-c)} .crow2.cong .tk.on{background:var(--tot-c)}
.crow2.crow{padding:8px 4px;flex-wrap:nowrap}
details summary{min-height:36px;display:flex;align-items:center}
@media print{.stackbar i,.donut circle,.hb .bar i,.chart .ar,.chart .ln{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
@media (max-width:899px){
  .sumstrip{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
  .sumstrip .st{flex:0 0 auto;min-width:86px;padding:6px 12px}
  .sumstrip .st b{font-size:17px}
  .bottom-nav button{font-size:10.5px;white-space:nowrap;padding:0 2px}
  .seg button{padding:0 11px}
  .page-head p{font-size:13.5px}
  .grid .reason{max-width:250px}
}
.grid .reason{display:block;white-space:normal;max-width:300px;margin-top:2px;font-size:12px;line-height:1.35}
/* ---- bản quyền / khóa dùng thử ---- */
.lock-scr{position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:20px;overflow:auto;background:linear-gradient(160deg,#2B1D7A 0%,#4B34C8 60%,#7C5CFF 100%)}
body.locked .lock-scr{display:flex}
body.locked .app,body.locked .bottom-nav,body.locked #modal-root{display:none!important}
.lock-card{width:min(440px,100%);padding:30px 26px 22px;border-radius:28px;background:var(--card);color:var(--ink);text-align:center;box-shadow:0 40px 80px -30px rgba(0,0,0,.65)}
.lock-card .logo{width:64px;height:64px;margin:0 auto 14px;border-radius:20px;display:grid;place-items:center;background:var(--brand-l);color:var(--brand)}
.lock-card h1{margin:0 0 8px;font-size:23px;font-weight:800;letter-spacing:-.3px}
.lock-card>p{margin:0 0 16px;color:var(--ink2)}
.lock-msg,.lock-card .lock-msg{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--yeu-bg);color:var(--yeu);font-weight:600;text-align:left;line-height:1.5}
.lock-card .chk{justify-content:flex-start;margin:4px 0 10px;display:flex}
.lock-msg a{color:inherit;font-weight:800}
.lock-msg[hidden]{display:none}
.copyright{margin:30px 0 0;text-align:center;font-size:12.5px;color:var(--mute)}
.lock-card .copyright{margin-top:20px}
.side .copy{padding:4px 6px 0;font-size:11.5px;line-height:1.45;color:rgba(255,255,255,.72)}
button.pill{border:0;cursor:pointer;font-family:var(--font)}
.pill.warn{background:var(--tb-bg);color:var(--tb)}
.lic-banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.print-copy{margin-top:12px;text-align:center;font-size:10.5px;color:#555}
</style>
</head>

<div class="app" id="app">
  <aside class="side" id="side"></aside>

    <header class="topbar" id="topbar"></header>
    <div class="print-only" id="printHead"></div>
    <main class="main" id="main"></main>
    <div class="print-only print-sign" id="printSign"></div>
    <div class="print-only print-copy" id="printCopy"></div>
  </div>
</div>
<nav class="bottom-nav" id="bnav" aria-label="Điều hướng"></nav>
<div id="toasts" aria-live="polite"></div>

<div class="lock-scr" id="lock" role="dialog" aria-modal="true" aria-labelledby="lockT">
  <div class="lock-card">
    <div class="logo"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width:32px;height:32px"><path d="M5 3h12a2 2 0 012 2v16H7a2 2 0 01-2-2V3zM5 19a2 2 0 012-2h12M9 7h6M9 11h6"/></svg></div>
    <h1 id="lockT">Đã hết thời gian dùng thử</h1>

    <form id="lockForm" autocomplete="off">
      <label class="f" style="text-align:left">Mật khẩu<input class="inp" id="lockPw" type="password" autocomplete="off" placeholder="Nhập mật khẩu"></label>
      <label class="chk"><input type="checkbox" id="lockShow">Hiện mật khẩu</label>

</div>

<script>
/*LOGIC_START*/
'use strict';
/* ==========================================================================
   PHẦN 1 - LÕI TÍNH TOÁN (không đụng tới giao diện)
   Bám sát "Bảng tiêu chí cộng/trừ điểm thi đua học sinh lớp".
   ========================================================================== */
const RANKS_W = ['Tốt', 'Khá', 'Trung bình', 'Yếu'];      // xếp loại tuần/tháng
const RANKS_HK = ['Tốt', 'Khá', 'Đạt', 'Chưa đạt'];       // hạnh kiểm
const LS_KEY = 'so-ne-nep-thi-dua-v1';

const r1 = x => Math.round(x * 10) / 10;
const mean = a => a.reduce((s, v) => s + v, 0) / a.length;
const avg = a => a.length ? r1(mean(a)) : null;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const noDia = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D');
const norm = s => noDia(s).toLowerCase().replace(/\s+/g, ' ').trim();
const vn = v => String(v).replace('.', ',');   // số thập phân kiểu Việt Nam
const uid = () => 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

/* ---- Tiêu chí mặc định (đúng theo file quy trình) ---- */
function defaultCriteria() {
  const SHORT = {T1: 'Đi học muộn', T2: 'Nghỉ học không phép', T3: 'Sai đồng phục', T4: 'Tóc nhuộm / trang điểm', T5: 'Nói chuyện riêng', T6: 'Dùng điện thoại', T7: 'Không học bài / làm bài', T8: 'Vô lễ với thầy cô', T9: 'Gian lận kiểm tra', T10: 'Không trực nhật / xả rác', T11: 'Không đội mũ bảo hiểm', T12: 'Lái xe chưa đủ điều kiện', T13: 'Gửi xe ngoài cổng trường', C1: 'Điểm 9, 10', C2: 'Điểm 8', C3: 'Phát biểu xây dựng bài', C4: 'Chuyên cần', C5: 'Phong trào Đoàn, ngoại khóa', C6: 'Việc tốt, nhặt của rơi', C7: 'Ban cán sự, tổ trưởng'};
  const mk = loai => (id, ten, diem, xuLy, x) => Object.assign(
    { id, loai, ten, ngan: SHORT[id], diem, toiDaTuan: 0, nghiemTrong: false, canhBao: 0, xuLy, an: false }, x || {});
  const T = mk('tru'), C = mk('cong');
  return [
    T('T1', 'Đi học muộn / Trễ giờ sinh hoạt lớp, chào cờ', 2, 'Cảnh cáo / Lần'),
    T('T2', 'Nghỉ học không phép', 5, 'Gọi điện cho phụ huynh'),

    T('T4', 'Tóc nhuộm màu, sai quy định; trang điểm, sơn móng', 5, 'Yêu cầu khắc phục ngay'),
    T('T5', 'Nói chuyện riêng, làm việc riêng, ồn ào trong giờ', 2, 'Nhắc nhở'),
    T('T6', 'Sử dụng điện thoại trong giờ khi chưa được phép', 30, 'Tịch thu giao GVCN xử lý', { nghiemTrong: true }),
    T('T7', 'Không học bài cũ, không làm bài tập về nhà', 5, 'Báo cáo GVCN / Lần'),
    T('T8', 'Vô lễ với giáo viên, cán bộ nhân viên nhà trường', 40, 'Hạ hạnh kiểm, mời phụ huynh', { canhBao: 1 }),
    T('T9', 'Gian lận trong kiểm tra, thi tập trung', 30, 'Hủy bài làm, lập biên bản', { nghiemTrong: true }),
    T('T10', 'Không hoàn thành trực nhật, xả rác bừa bãi', 5, 'Bắt buộc trực nhật lại', { nghiemTrong: true }),
    T('T11', 'Không đội mũ bảo hiểm khi đi xe đạp điện, xe máy điện', 20, 'Viết bản kiểm điểm, hạ hạnh kiểm nếu tái phạm', { canhBao: 2 }),
    T('T12', 'Điều khiển xe máy điện, xe máy khi chưa đủ điều kiện/độ tuổi', 30, 'Mời phụ huynh ký cam kết'),
    T('T13', 'Gửi xe ngoài cổng trường, không gửi trong bãi xe nhà trường', 20, 'Cảnh cáo, yêu cầu khắc phục'),
    C('C1', 'Đạt điểm 9, 10 (Miệng, Giữa kỳ, Cuối kỳ)', 5, 'Cộng / Lần'),
    C('C2', 'Đạt điểm 8', 2, 'Cộng / Lần'),

          sumTab: 'thang', sumHK: 'HK1', sumMonth: 0, stScope: 'week', stHK: 'HK1', stWeek: 1, stMonth: 0 }

function deepMerge(base, over) {
  if (Array.isArray(base) || typeof base !== 'object' || base === null) return over === undefined ? base : over;
  const out = {};
  for (const k of Object.keys(base)) out[k] = (over && k in over) ? deepMerge(base[k], over[k]) : base[k];
  if (over && typeof over === 'object') for (const k of Object.keys(over)) if (!(k in out)) out[k] = over[k];
  return out;
}

let S = null;      // trạng thái toàn ứng dụng
let CM = {};       // bản đồ tiêu chí theo id
function rebuildCM() { CM = {}; S.criteria.forEach(c => { CM[c.id] = c; }); }

/* ---- Truy cập dữ liệu tuần ---- */
const weekKey = (hk, w) => hk + '-' + w;
const getWeek = (hk, w) => S.weeks[weekKey(hk, w)];
const getEntry = (hk, w, sid) => { const wk = getWeek(hk, w); return wk && wk.e ? (wk.e[sid] || null) : null; };
const isClosed = (hk, w) => { const wk = getWeek(hk, w); return !!(wk && wk.chot); };
function ensureEntry(hk, w, sid) {
  const k = weekKey(hk, w);
  if (!S.weeks[k]) S.weeks[k] = { chot: false, e: {} };
  const wk = S.weeks[k]; if (!wk.e) wk.e = {};
  if (!wk.e[sid]) wk.e[sid] = { items: [], adj: 0, ghiChu: '' };
  return wk.e[sid];
}
const itemLoai = it => it.l || (CM[it.cid] && CM[it.cid].loai) || 'tru';

/* ---- Điểm một tuần của một học sinh ---- */
function entryTotals(en) {
  let cong = 0, tru = 0;
  if (en) for (const it of en.items) {
    const v = (+it.n || 0) * (+it.d || 0);
    if (itemLoai(it) === 'cong') cong += v; else tru += v;
  }
  const adj = en ? (+en.adj || 0) : 0;
  return { cong: r1(cong), tru: r1(tru), adj, tong: r1(S.settings.diemSan + cong - tru + adj) };
}

/* Xếp loại theo ngưỡng: Tốt >= 98 | Khá >= 90 | Trung bình >= 70 | Yếu < 70 */
function rankOf(score) {
  const g = S.settings.nguong;
  const v = r1(score);
  return v >= g.tot ? 'Tốt' : v >= g.kha ? 'Khá' : v >= g.tb ? 'Trung bình' : 'Yếu';
}
const weekScore = (sid, hk, w) => entryTotals(getEntry(hk, w, sid)).tong;
const weekList = hk => Array.from({ length: S.settings.hk[hk].tuan }, (_, i) => i + 1);
const closedWeeks = hk => weekList(hk).filter(w => isClosed(hk, w));

/* Chia "tháng" trong học kỳ (mặc định HK1: 4-5-4-5, HK2: 4-4-4-5) */
function monthsOf(hk) {
  const cfg = S.settings.hk[hk]; let start = 1;
  return cfg.thang.map((len, i) => {
    const ws = []; for (let k = 0; k < len; k++) ws.push(start + k); start += len;
    return { idx: i, name: cfg.ten[i] || ('Tháng ' + (i + 1)), weeks: ws };
  });
}
/* Điểm TB tháng = TB cộng các tuần ĐÃ CHỐT trong tháng */
function monthAvg(sid, hk, mi) {
  const m = monthsOf(hk)[mi]; if (!m) return null;
  return avg(m.weeks.filter(w => isClosed(hk, w)).map(w => weekScore(sid, hk, w)));
}
/* Điểm TB kỳ = TB cộng các TB tháng (hoặc TB trực tiếp các tuần nếu chọn trong Cài đặt) */
function kyAvg(sid, hk) {
  if (S.settings.tbKyTuThang) {
    return avg(monthsOf(hk).map((_, i) => monthAvg(sid, hk, i)).filter(v => v !== null));
  }
  return avg(closedWeeks(hk).map(w => weekScore(sid, hk, w)));
}
/* Điểm TB cả năm = bình quân gia quyền TB HK1, TB HK2 (hệ số mặc định 1:1) */
function namAvg(sid) {
  const a = kyAvg(sid, 'HK1'), b = kyAvg(sid, 'HK2');
  const h1 = +S.settings.heSo.HK1 || 0, h2 = +S.settings.heSo.HK2 || 0;
  if (a === null && b === null) return null;
  if (a === null) return b;
  if (b === null) return a;
  if (h1 + h2 <= 0) return r1((a + b) / 2);
  return r1((a * h1 + b * h2) / (h1 + h2));
}

/* ---- Phạm vi thống kê ---- */
function scopePairs(sc) {
  if (sc.type === 'week') return [[sc.hk, sc.w]];
  if (sc.type === 'month') { const m = monthsOf(sc.hk)[sc.m]; return m ? m.weeks.filter(w => isClosed(sc.hk, w)).map(w => [sc.hk, w]) : []; }
  if (sc.type === 'HK1' || sc.type === 'HK2') return closedWeeks(sc.type).map(w => [sc.type, w]);
  if (sc.type === 'NAM') return closedWeeks('HK1').map(w => ['HK1', w]).concat(closedWeeks('HK2').map(w => ['HK2', w]));
  return [];
}
function scopeScore(sid, sc) {
  if (sc.type === 'week') return weekScore(sid, sc.hk, sc.w);
  if (sc.type === 'month') return monthAvg(sid, sc.hk, sc.m);
  if (sc.type === 'NAM') return namAvg(sid);
  return kyAvg(sid, sc.type);
}

/* ---- Thống kê của một học sinh trong kỳ/năm (đầu vào để đề xuất hạnh kiểm) ---- */
function periodStats(sid, scope) {
  const pairs = scopePairs({ type: scope });
  const scores = pairs.map(([hk, w]) => weekScore(sid, hk, w));
  const ranks = scores.map(rankOf);
  const a = scopeScore(sid, { type: scope });
  let nNT = 0; const cnt = {};
  for (const [hk, w] of pairs) {
    const en = getEntry(hk, w, sid); if (!en) continue;
    for (const it of en.items) {
      const c = CM[it.cid]; const n = +it.n || 0;
      cnt[it.cid] = (cnt[it.cid] || 0) + n;
      if (c && c.loai === 'tru' && c.nghiemTrong) nNT += n;
    }
  }
  let tienBo = false;
  if (scores.length >= 4) { const h = Math.floor(scores.length / 2); tienBo = mean(scores.slice(-h)) > mean(scores.slice(0, h)); }
  const warns = [];
  for (const c of S.criteria) {
    const n = cnt[c.id] || 0;
    if (c.loai === 'tru' && ((c.canhBao === 1 && n >= 1) || (c.canhBao === 2 && n >= 2))) warns.push(c.id + ' (' + n + ' lần)');
  }
  return {
    n: pairs.length, avg: a, rank: a === null ? null : rankOf(a),
    nYeu: ranks.filter(r => r === 'Yếu').length,
    nTB: ranks.filter(r => r === 'Trung bình').length,
    nNT, tienBo, warns
  };
}

/* ---- Đề xuất hạnh kiểm theo "Quy chế quy đổi" - xét lần lượt Chưa đạt -> Tốt -> Khá -> Đạt ---- */
function deXuatHK(st, kkp) {
  if (!st || st.avg === null) return null;
  const g = S.settings.nguongHK; const ly = [];
  if (st.rank === 'Yếu') ly.push('Điểm TB ' + vn(st.avg) + ' thuộc loại Yếu');
  if (st.nYeu >= g.yeu) ly.push('Có ' + st.nYeu + ' tuần xếp loại Yếu (thường xuyên)');
  if (st.nNT >= g.nt) ly.push('Vi phạm lỗi nghiêm trọng ' + st.nNT + ' lần');
  if (kkp) ly.push('GVCN đánh dấu: chưa có ý thức khắc phục');
  if (ly.length) return { hk: 'Chưa đạt', ly };
  if (st.rank === 'Tốt' && st.nYeu === 0 && st.nNT === 0)
    return { hk: 'Tốt', ly: ['Điểm TB loại Tốt, không có tuần Yếu, không vi phạm lỗi nghiêm trọng'] };
  if (st.rank === 'Tốt') {
    const l = []; if (st.nYeu > 0) l.push('có ' + st.nYeu + ' tuần Yếu'); if (st.nNT > 0) l.push('vi phạm lỗi nghiêm trọng ' + st.nNT + ' lần');
    return { hk: 'Khá', ly: [l.join(', ') + ' nên chưa đạt mức Tốt'] };
  }
  if (st.rank === 'Khá') return { hk: 'Khá', ly: ['Điểm TB loại Khá'] };
  if (st.rank === 'Trung bình' && st.nTB >= 1 && st.nTB <= 2 && st.tienBo)
    return { hk: 'Khá', ly: ['Chỉ ' + st.nTB + ' tuần Trung bình và có tiến bộ'] };
  return { hk: 'Đạt', ly: ['Điểm TB loại Trung bình, còn vi phạm nề nếp'] };
}
function hanhKiem(sid, scope) {
  const st = periodStats(sid, scope);
  const rec = (S.hk[sid] && S.hk[sid][scope]) || {};
  const de = deXuatHK(st, !!rec.kkp);
  return { st, de, rec, final: rec.final || (de ? de.hk : null), official: !!rec.final };
}

/* ---- Thống kê vi phạm ---- */
function violationStats(sc) {
  const pairs = scopePairs(sc); const rows = [], clean = [], byCrit = {};
  for (const stu of S.students) {
    const cnt = {}; let soLan = 0, diem = 0;
    for (const [hk, w] of pairs) {
      const en = getEntry(hk, w, stu.id); if (!en) continue;
      for (const it of en.items) {
        if (itemLoai(it) !== 'tru') continue;
        const n = +it.n || 0;
        cnt[it.cid] = (cnt[it.cid] || 0) + n; soLan += n; diem += n * (+it.d || 0);
        byCrit[it.cid] = (byCrit[it.cid] || 0) + n;
      }
    }
    const sco = scopeScore(stu.id, sc);
    const row = { sid: stu.id, name: stu.ten, cnt, soLan, diem: r1(diem), score: sco, rank: sco === null ? null : rankOf(sco) };
    (soLan > 0 ? rows : clean).push(row);
  }
  rows.sort((a, b) => b.diem - a.diem || b.soLan - a.soLan);
  return { rows, clean, byCrit };
}

/* ---- Tỷ lệ % (làm tròn 1 chữ số thập phân, tổng luôn = 100%) ---- */
function pctRound(counts) {
  const total = counts.reduce((a, b) => a + b, 0);
  if (!total) return counts.map(() => 0);
  const raw = counts.map(c => c * 1000 / total), fl = raw.map(Math.floor);
  let rem = 1000 - fl.reduce((a, b) => a + b, 0);
  raw.map((v, i) => [v - fl[i], i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (rem > 0) { fl[i]++; rem--; } });
  return fl.map(v => v / 10);
}
function distOf(list, cats) {
  const counts = cats.map(() => 0);
  list.forEach(r => { const i = cats.indexOf(r); if (i >= 0) counts[i]++; });
  const total = counts.reduce((a, b) => a + b, 0);
  return { cats, counts, total, pct: pctRound(counts) };
}
/* Tuần/Tháng -> xếp loại điểm; Học kỳ/Năm -> hạnh kiểm */
function distScope(sc) {
  if (sc.type === 'HK1' || sc.type === 'HK2' || sc.type === 'NAM')
    return distOf(S.students.map(s => hanhKiem(s.id, sc.type).final).filter(Boolean), RANKS_HK);
  return distOf(S.students.map(s => scopeScore(s.id, sc)).filter(v => v !== null).map(rankOf), RANKS_W);
}

/* ---- Xu hướng điểm TB lớp qua các tuần đã chốt ---- */
function trendData() {
  const out = [];
  for (const hk of ['HK1', 'HK2']) {
    const off = hk === 'HK1' ? 0 : S.settings.hk.HK1.tuan;
    for (const w of closedWeeks(hk)) {
      const sc = S.students.map(s => weekScore(s.id, hk, w));
      if (!sc.length) continue;
      out.push({ hk, w, idx: off + w, avg: avg(sc), pctTot: r1(sc.filter(v => rankOf(v) === 'Tốt').length * 100 / sc.length) });
    }
  }
  return out;
}

/* ---- Tên Việt: sắp xếp theo tên rồi đến họ đệm ---- */
function sortByGivenName(a, b) {
  const pa = a.ten.trim().split(/\s+/), pb = b.ten.trim().split(/\s+/);
  return pa[pa.length - 1].localeCompare(pb[pb.length - 1], 'vi') || a.ten.localeCompare(b.ten, 'vi');
}

/* ---- Đọc bảng tính danh sách học sinh (mảng 2 chiều) ---- */
function parseStudentSheet(aoa) {
  const HEAD = ['ho va ten', 'ho ten', 'ten', 'ho va ten hoc sinh', 'ten hoc sinh', 'hoc sinh', 'ho & ten', 'ho, ten'];
  const SKIP = ['stt', 'so thu tu', 'tt', 'ho va ten', 'ho ten', 'ten', 'hoc sinh', 'ten hoc sinh', 'ho va ten hoc sinh'];
  let hr = -1, col = -1;
  for (let r = 0; r < Math.min(aoa.length, 15) && hr < 0; r++)
    for (let c = 0; c < (aoa[r] || []).length; c++) if (HEAD.includes(norm(aoa[r][c]))) { hr = r; col = c; break; }
  const hasLetters = v => /[A-Za-zÀ-ỹ]/.test(String(v || ''));
  let headerFound = hr >= 0;
  if (!headerFound) {
    let best = -1, bc = 0; const width = Math.max(0, ...aoa.map(r => (r || []).length));
    for (let c = 0; c < width; c++) { const n = aoa.filter(r => r && hasLetters(r[c]) && String(r[c]).trim().length >= 2).length; if (n > bc) { bc = n; best = c; } }
    if (best < 0) return { names: [], headerFound: false, col: -1 };
    col = best; hr = -1;
  }
  const names = [];
  for (let r = hr + 1; r < aoa.length; r++) {
    const raw = aoa[r] ? aoa[r][col] : '';
    const name = String(raw == null ? '' : raw).replace(/\s+/g, ' ').trim();
    if (!name || !hasLetters(name)) continue;
    if (!headerFound && SKIP.includes(norm(name))) continue;
    names.push(name);
  }
  return { names, headerFound, col };
}

  box.appendChild(el);
  setTimeout(() => el.remove(), action ? 7000 : (type === 'err' ? 6000 : 2800));
}

const ACT = {}, CHG = {}, INP = {};
const openCards = new Set();
const curMode = () => S.ui.mode || (window.innerWidth < 900 ? 'cards' : 'matrix');

const curWeek = () => ({ hk: S.ui.hk, w: S.ui.week });

const sg = c => c.loai === 'tru' ? '−' : '+';

function weekDates(hk, w) {
  const st = S.settings['ngayBatDau' + hk]; if (!st) return '';
  const d = new Date(st + 'T00:00:00'); if (isNaN(d)) return '';
  d.setDate(d.getDate() + (w - 1) * 7); const e = new Date(d); e.setDate(e.getDate() + 5);
  const f = x => String(x.getDate()).padStart(2, '0') + '/' + String(x.getMonth() + 1).padStart(2, '0');
  return f(d) + '–' + f(e);
}
function weekStudents() {
  const q = norm(S.ui.q), { hk, w } = curWeek();
  return S.students.map((s, i) => ({ s, i })).filter(({ s }) => {
    if (q && !norm(s.ten).includes(q)) return false;
    if (S.ui.onlyViol) { const en = getEntry(hk, w, s.id); if (!en || !en.items.some(it => itemLoai(it) === 'tru')) return false; }
    return true;
  });
}

  </div>
  <div id="weekBody">${weekBodyHTML()}</div>`;
}
function weekSummaryHTML() {
  const { hk, w } = curWeek(), closed = isClosed(hk, w);
  const sc = S.students.map(s => weekScore(s.id, hk, w)), d = distOf(sc.map(rankOf), RANKS_W);

/* ---------- Ma trận (máy tính) ---------- */
function matrixHTML(list) {
  const crs = activeCriteria(), tru = crs.filter(c => c.loai === 'tru'), cong = crs.filter(c => c.loai === 'cong');
  const hc = c => `<th class="${c.loai}" title="${esc(c.id + ': ' + c.ten + ' (' + sg(c) + fmt(c.diem) + ')')}"><span class="cp">${c.id} · ${sg(c)}${fmt(c.diem)}</span><span class="cn">${esc(c.ten)}</span></th>`;

  return `<div class="table-wrap"><table class="grid mx"><thead>

      ${tru.length ? `<th class="g-tru" colspan="${tru.length}">Trừ điểm</th>` : ''}${cong.length ? `<th class="g-cong" colspan="${cong.length}">Cộng điểm</th>` : ''}

function cellHTML(sid, c, en) {

function matrixRowHTML(s, i) {

    <div class="ct"><b>${c.id}</b> ${esc(c.ten)}<small>${sg(c)}${fmt(c.diem)} điểm${c.toiDaTuan ? ' · tối đa ' + c.toiDaTuan + ' lần/tuần' : ''}</small></div>

}
function cardHTML(s, i) {
  const { hk, w } = curWeek(), en = getEntry(hk, w, s.id), t = entryTotals(en), rk = rankOf(t.tong), open = openCards.has(s.id);

function critHTML(list) {
  const crs = activeCriteria(); if (!crs.length) return '<div class="card empty"><p>Chưa có tiêu chí nào đang bật. Hãy bật tiêu chí trong Cài đặt.</p></div>';
  const sel = CM[S.ui.critSel] && !CM[S.ui.critSel].an ? S.ui.critSel : crs[0].id; S.ui.critSel = sel;
  const c = CM[sel], { hk, w } = curWeek();
  const cnt = S.students.filter(s => { const en = getEntry(hk, w, s.id); return en && en.items.some(i => i.cid === sel); }).length;
  return `<div class="card"><div class="cchips" role="group" aria-label="Chọn tiêu chí">${crs.map(x => `<button type="button" class="cchip ${x.loai} ${x.id === sel ? 'on' : ''}" data-act="critSel" data-cid="${x.id}"><b>${x.id}</b> ${sg(x)}${fmt(x.diem)}</button>`).join('')}</div>
    <div class="note info" style="margin-bottom:6px"><b>${c.id}</b> · ${esc(c.ten)} (${sg(c)}${fmt(c.diem)} điểm${c.toiDaTuan ? ', tối đa ' + c.toiDaTuan + ' lần/tuần' : ''}) · Đã ghi nhận <b id="critCount">${cnt}</b> học sinh</div>
    ${list.map(({ s, i }) => crit2HTML(s, i, c)).join('')}</div>`;
}
function crit2HTML(s, i, c) {
  const { hk, w } = curWeek(), en = getEntry(hk, w, s.id), it = en && en.items.find(x => x.cid === c.id), max = c.toiDaTuan > 0 ? c.toiDaTuan : 999;
  return `<div class="crow2 crow ${c.loai}" data-crow="${s.id}" style="border-top:0"><span class="no">${i + 1}</span><span class="nm">${esc(s.ten)}</span>
    ${it && max > 1 ? `<div class="step"><button type="button" data-act="dec" data-sid="${s.id}" data-cid="${c.id}" aria-label="Giảm số lần">−</button><span>${it.n}</span><button type="button" data-act="inc" data-sid="${s.id}" data-cid="${c.id}" aria-label="Tăng số lần" ${it.n >= max ? 'disabled' : ''}>+</button></div>` : ''}
    <button type="button" class="tk ${it ? 'on' : ''}" data-act="${it ? 'untick' : 'tick'}" data-sid="${s.id}" data-cid="${c.id}" aria-pressed="${!!it}" aria-label="${esc(s.ten)}">${ic('check')}</button></div>`;
}

function refreshSummary() { const el = $('#weekSummary'); if (el) el.innerHTML = weekSummaryHTML(); }
function refreshStudent(sid) {
  const mode = curMode(), idx = S.students.findIndex(s => s.id === sid); if (idx < 0) return;
  const s = S.students[idx], ae = document.activeElement;
  const key = ae && ae.dataset && ae.dataset.chg && ae.dataset.sid ? [ae.dataset.chg, ae.dataset.sid, ae.dataset.cid || ''] : null;
  let old = null, html = '';
  if (mode === 'matrix') { old = $(`tr[data-row="${sid}"]`); html = matrixRowHTML(s, idx); }
  else if (mode === 'cards') { old = $(`[data-card="${sid}"]`); html = cardHTML(s, idx); }
  else if (mode === 'crit') { const c = CM[S.ui.critSel]; old = $(`[data-crow="${sid}"]`); html = c ? crit2HTML(s, idx, c) : ''; }
  if (old && html) { old.insertAdjacentHTML('afterend', html); old.remove(); }
  if (mode === 'crit') { const { hk, w } = curWeek(); const el = $('#critCount'); if (el) el.textContent = S.students.filter(x => { const en = getEntry(hk, w, x.id); return en && en.items.some(i => i.cid === S.ui.critSel); }).length; }
  if (key) { const n = $(`[data-chg="${key[0]}"][data-sid="${key[1]}"]${key[2] ? `[data-cid="${key[2]}"]` : ''}`); if (n) n.focus(); }
  refreshSummary();
}
function afterChange(sid) { save(); refreshStudent(sid); }

function tickItem(sid, cid) {
  const { hk, w } = curWeek(), c = CM[cid]; if (!c) return;
  const en = ensureEntry(hk, w, sid); if (en.items.some(i => i.cid === cid)) return;
  en.items.push({ cid, l: c.loai, n: 1, d: c.diem }); afterChange(sid);
}
function untickItem(sid, cid) {
  const { hk, w } = curWeek(), en = getEntry(hk, w, sid); if (!en) return;
  en.items = en.items.filter(i => i.cid !== cid); afterChange(sid);
}
function stepItem(sid, cid, delta) {
  const { hk, w } = curWeek(), en = getEntry(hk, w, sid), c = CM[cid], it = en && en.items.find(i => i.cid === cid); if (!it) return;
  const max = c.toiDaTuan > 0 ? c.toiDaTuan : 999, n = it.n + delta;
  if (n < 1) return untickItem(sid, cid);
  if (n > max) { toast('Mục này tối đa ' + max + ' lần/tuần', 'err'); return; }
  it.n = n; afterChange(sid);
}

/* ---------- Biểu đồ nhỏ (SVG/CSS tự vẽ, không phụ thuộc thư viện) ---------- */
function lineSVG(pts, o) {
  if (!pts.length) return '';
  const W = 640, H = 220, pl = 46, pr = 18, pt = 16, pb = 34;
  let lo = o.min !== undefined ? o.min : Math.floor(Math.min(...pts.map(p => p.y)) - 5);
  let hi = o.max !== undefined ? o.max : Math.ceil(Math.max(...pts.map(p => p.y)) + 5);
  if (hi - lo < 10) { lo -= 5; hi += 5; }
  const X = i => pl + (pts.length === 1 ? (W - pl - pr) / 2 : i * (W - pl - pr) / (pts.length - 1));
  const Y = v => pt + (hi - v) * (H - pt - pb) / (hi - lo);
  let grid = '';
  for (let k = 0; k <= 4; k++) { const v = lo + k * (hi - lo) / 4, y = Y(v); grid += `<line class="ax" x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}"/><text class="tx" x="${pl - 8}" y="${y + 4}" text-anchor="end">${Math.round(v)}${o.unit || ''}</text>`; }
  const step = Math.ceil(pts.length / 10);
  const xl = pts.map((p, i) => i % step === 0 || i === pts.length - 1 ? `<text class="tx" x="${X(i)}" y="${H - 10}" text-anchor="middle">${esc(p.x)}</text>` : '').join('');
  const line = pts.map((p, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ' ' + Y(p.y).toFixed(1)).join(' ');
  const area = line + ` L${X(pts.length - 1).toFixed(1)} ${Y(lo)} L${X(0).toFixed(1)} ${Y(lo)}Z`;
  const dots = pts.map((p, i) => `<circle class="dt" cx="${X(i).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="4"><title>${esc(p.x)}: ${fmt(p.y)}${o.unit || ''}</title></circle>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label)}">${grid}<path class="ar" d="${area}"/><path class="ln" d="${line}"/>${dots}${xl}</svg>`;
}
function donutHTML(d, top, sub) {
  const R = 62, C = 2 * Math.PI * R; let off = 0;
  const segs = d.total ? d.counts.map((n, i) => { if (!n) return ''; const len = n / d.total * C; const el = `<circle class="s-${RC[d.cats[i]]}" cx="85" cy="85" r="${R}" stroke-dasharray="${len.toFixed(2)} ${(C - len).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`; off += len; return el; }).join('') : '';
  return `<div class="donut"><svg viewBox="0 0 170 170" role="img" aria-label="Biểu đồ tỷ lệ phần trăm"><circle class="s-bg" cx="85" cy="85" r="${R}"/>${segs}</svg><div class="ct"><b>${top}</b><small>${sub}</small></div></div>`;
}
function distTable(d, firstCol) {
  return `<table class="mini"><thead><tr><th>${firstCol}</th><th>Số HS</th><th>Tỷ lệ</th></tr></thead><tbody>${d.cats.map((c, i) => `<tr><td><span class="legend" style="margin:0"><span class="c-${RC[c]}">${c}</span></span></td><td>${d.counts[i]}</td><td><b>${fmt(d.pct[i])}%</b></td></tr>`).join('')}<tr><td><b>Tổng</b></td><td><b>${d.total}</b></td><td><b>${d.total ? '100%' : '—'}</b></td></tr></tbody></table>`;
}
function stackBar(d) {
  if (!d.total) return '<div class="stackbar"></div>';
  return `<div class="stackbar" role="img" aria-label="${d.cats.map((c, i) => c + ' ' + fmt(d.pct[i]) + '%').join(', ')}">${d.cats.map((c, i) => d.counts[i] ? `<i class="c-${RC[c]}" style="width:${d.pct[i]}%" title="${c}: ${d.counts[i]} HS (${fmt(d.pct[i])}%)">${d.pct[i] >= 9 ? fmt(d.pct[i]) + '%' : ''}</i>` : '').join('')}</div>`;
}

  }
  const { hk, w } = curWeek(), closed = isClosed(hk, w);
  const rows = S.students.map(s => ({ s, t: entryTotals(getEntry(hk, w, s.id)), en: getEntry(hk, w, s.id) })).map(r => ({ ...r, sc: r.t.tong, rk: rankOf(r.t.tong) }));
  const a = avg(rows.map(r => r.sc)), d = distOf(rows.map(r => r.rk), RANKS_W);

  const closedAll = closedWeeks('HK1').length + closedWeeks('HK2').length, totalW = S.settings.hk.HK1.tuan + S.settings.hk.HK2.tuan;

  const cntOf = en => { const c = {}; if (en) en.items.forEach(it => { if (itemLoai(it) === 'tru') c[it.cid] = (c[it.cid] || 0) + (+it.n || 0); }); return c; };
  const tr = trendData();
  return head + `

      <div><h3>Tuần ${w} · ${hkName(hk)}</h3><p>${closed ? 'Đã chốt' : 'Chưa chốt'} · ${nV} học sinh có vi phạm · ${d.counts[0]} học sinh xếp loại Tốt</p>
      <div class="row"><button class="btn pri" data-act="goWeek">${ic('edit')}Nhập thi đua tuần này</button><button class="btn ghost" data-act="nav" data-view="stats">Xem thống kê</button></div></div>

/* ==========================  HỌC SINH  ========================== */
function snapshotData() { return JSON.stringify({ students: S.students, weeks: S.weeks, hk: S.hk, notes: S.notes }); }
function restoreData(snap) { const o = JSON.parse(snap); S.students = o.students; S.weeks = o.weeks; S.hk = o.hk; S.notes = o.notes; }
function purgeStudentData(ids) {
  const set = new Set(ids);
  Object.values(S.weeks).forEach(wk => { if (wk.e) ids.forEach(id => delete wk.e[id]); });
  ids.forEach(id => delete S.hk[id]);
  Object.keys(S.notes).forEach(k => { if (set.has(k.split('|')[1])) delete S.notes[k]; });
}
function renderStudents() {
  const n = S.students.length;
  return `<div class="page-head"><div><h2>Danh sách học sinh</h2><p>${n ? n + ' học sinh. ' : ''}Nhập từ Excel hoặc thêm thủ công. Bấm vào tên để sửa trực tiếp.</p></div>
    <div class="row"><button class="btn" data-act="tplExcel">${ic('down')}Tải file mẫu</button><button class="btn pri" data-act="importExcel">${ic('up')}Nhập từ Excel</button></div></div>
  ${n ? `<div class="card"><div class="row sb" style="margin-bottom:12px"><div class="row"><button class="btn sm" data-act="addStudents">${ic('plus', 16)}Thêm học sinh</button><button class="btn sm ghost" data-act="sortAZ">Sắp xếp A–Z theo tên</button></div><button class="btn sm dng" data-act="clearStudents">${ic('trash', 16)}Xóa toàn bộ</button></div>
    <div class="table-wrap"><table class="grid tbl-edit"><thead><tr><th class="c-stt">STT</th><th class="l c-name" style="max-width:none">Họ và tên</th><th style="width:150px">Thao tác</th></tr></thead><tbody>
    ${S.students.map((s, i) => `<tr><td class="c-stt">${i + 1}</td><td class="l c-name" style="max-width:none;box-shadow:none"><input type="text" value="${esc(s.ten)}" data-chg="rename" data-sid="${s.id}" aria-label="Họ và tên học sinh số ${i + 1}"></td>
      <td><div class="row" style="flex-wrap:nowrap;justify-content:center;gap:2px"><button class="icon-btn" data-act="moveUp" data-sid="${s.id}" aria-label="Chuyển lên" ${i === 0 ? 'disabled style="opacity:.3"' : ''}>${ic('arrUp')}</button><button class="icon-btn" data-act="moveDown" data-sid="${s.id}" aria-label="Chuyển xuống" ${i === n - 1 ? 'disabled style="opacity:.3"' : ''}>${ic('arrDown')}</button><button class="icon-btn" data-act="delStudent" data-sid="${s.id}" aria-label="Xóa ${esc(s.ten)}" style="color:var(--yeu)">${ic('trash')}</button></div></td></tr>`).join('')}
    </tbody></table></div></div>` : emptyStudents()}`;
}

    const snap = snapshotData(); S.students = S.students.filter(x => x.id !== s.id); purgeStudentData([s.id]); save(); render();

ACT.clearStudents = () => confirmBox('Xóa toàn bộ danh sách?', 'Toàn bộ học sinh cùng dữ liệu thi đua sẽ bị xóa. Bạn có thể hoàn tác ngay sau đó.', 'Xóa toàn bộ', () => {
  const snap = snapshotData(); S.students = []; S.weeks = {}; S.hk = {}; S.notes = {}; save(); render(); toastUndo('Đã xóa danh sách học sinh', () => restoreData(snap));
}, true);
const moveStu = (id, d) => { const i = S.students.findIndex(s => s.id === id), j = i + d; if (i < 0 || j < 0 || j >= S.students.length) return; [S.students[i], S.students[j]] = [S.students[j], S.students[i]]; save(); render(); };
ACT.moveUp = el => moveStu(el.dataset.sid, -1);

CHG.rename = el => { const s = S.students.find(x => x.id === el.dataset.sid), v = el.value.replace(/\s+/g, ' ').trim(); if (!s) return; if (!v) { toast('Họ tên không được để trống', 'err'); el.value = s.ten; return; } s.ten = v; save(); };

/* ---------- Nhập danh sách từ Excel ---------- */
let IMP = null;
ACT.importExcel = () => { const f = $('#fileExcel'); f.value = ''; f.click(); };
function handleExcelFile(file) {
  if (!file) return;
  if (!window.XLSX) { toast('Chưa tải được thư viện đọc Excel. Hãy kết nối Internet rồi tải lại trang.', 'err'); return; }
  const r = new FileReader();
  const isCsv = /\.csv$/i.test(file.name);
  r.onerror = () => toast('Không đọc được file này. Hãy thử lại hoặc chọn file khác.', 'err');
  r.onload = e => {
    try {
      const wb = isCsv ? XLSX.read(String(e.target.result).replace(/^\uFEFF/, ''), { type: 'string' }) : XLSX.read(e.target.result, { type: 'array' });
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', blankrows: false });
      const res = parseStudentSheet(aoa);
      if (!res.names.length) { toast('Không thấy cột "Họ và tên" có dữ liệu. Hãy dùng file mẫu: cột A là STT, cột B là Họ và tên.', 'err'); return; }
      showImportPreview(res, file.name);
    } catch (err) { toast('File không phải Excel (.xlsx, .xls) hợp lệ hoặc đã bị hỏng.', 'err'); }
  };
  if (isCsv) r.readAsText(file, 'utf-8'); else r.readAsArrayBuffer(file);
}
function impDefaults(mode) { IMP.mode = mode; IMP.rows.forEach(r => { r.use = mode === 'add' ? !r.dupExist : true; }); }
function showImportPreview(res, fname) {
  const exist = new Set(S.students.map(s => norm(s.ten))), seen = new Set();
  const rows = res.names.map(name => { const k = norm(name), dupFile = seen.has(k); seen.add(k); return { name, dupFile, dupExist: exist.has(k), use: true }; });
  IMP = { rows, mode: 'add', fname, headerFound: res.headerFound };
  impDefaults('add'); renderImportModal();
}
function impCounts() {
  const used = IMP.rows.filter(r => r.use);
  if (IMP.mode === 'add') return `Sẽ thêm <b>${used.length}</b> học sinh vào danh sách hiện có.`;
  const keep = new Set(used.map(r => norm(r.name))); const old = S.students.filter(s => !keep.has(norm(s.ten))).length;
  const kept = S.students.length - old;
  return `Danh sách mới có <b>${used.length}</b> học sinh: giữ dữ liệu của <b>${kept}</b> em trùng tên, thêm <b>${used.length - kept}</b> em mới, xóa <b>${old}</b> em không có trong file (kèm dữ liệu thi đua).`;
}
function renderImportModal() {
  const dupN = IMP.rows.filter(r => r.dupExist || r.dupFile).length;
  modal({
    title: 'Xem trước danh sách nhập', wide: true,
    body: `<p>Đọc từ <b>${esc(IMP.fname || 'file')}</b>: tìm thấy <b>${IMP.rows.length}</b> học sinh${IMP.headerFound ? '' : ' (không thấy tiêu đề "Họ và tên", app tự chọn cột có tên)'}.${dupN ? ` Có <b>${dupN}</b> dòng trùng tên (tô vàng).` : ''}</p>
    <div class="imp-opts"><label><input type="radio" name="impMode" value="add" ${IMP.mode === 'add' ? 'checked' : ''} data-chg="impMode">Thêm vào danh sách</label><label><input type="radio" name="impMode" value="replace" ${IMP.mode === 'replace' ? 'checked' : ''} data-chg="impMode">Thay thế danh sách</label></div>
    <p class="note info" id="impCount">${impCounts()}</p>
    <div class="table-wrap free" style="max-height:300px;margin-top:10px"><table class="grid"><thead><tr><th style="width:56px">Nhập</th><th class="l">Họ và tên</th><th>Ghi chú</th></tr></thead><tbody>
    ${IMP.rows.map((r, i) => `<tr><td><input type="checkbox" data-chg="impUse" data-i="${i}" ${r.use ? 'checked' : ''} aria-label="Nhập ${esc(r.name)}" style="width:20px;height:20px;accent-color:var(--brand)"></td><td class="l" style="${r.dupExist || r.dupFile ? 'background:var(--tb-bg)' : ''}">${esc(r.name)}</td><td>${r.dupExist ? '<span class="badge warn">Đã có trong lớp</span>' : r.dupFile ? '<span class="badge warn">Trùng trong file</span>' : ''}</td></tr>`).join('')}</tbody></table></div>`,
    actions: [{ label: 'Hủy', cls: 'ghost', fn: () => { IMP = null; } }, { label: 'Nhập vào lớp', cls: 'pri', fn: applyImport }]
  });
}
CHG.impMode = el => { impDefaults(el.value); renderImportModal(); };
CHG.impUse = el => { IMP.rows[+el.dataset.i].use = el.checked; const c = $('#impCount'); if (c) c.innerHTML = impCounts(); };
function applyImport() {
  const used = IMP.rows.filter(r => r.use);
  if (!used.length) { toast('Bạn chưa chọn học sinh nào để nhập', 'err'); return false; }
  const snap = snapshotData();
  if (IMP.mode === 'add') used.forEach(r => S.students.push({ id: uid(), ten: r.name }));
  else {
    const pool = new Map(); S.students.forEach(s => { const k = norm(s.ten); if (!pool.has(k)) pool.set(k, []); pool.get(k).push(s); });
    const next = [], reused = new Set();
    used.forEach(r => { const arr = pool.get(norm(r.name)); const s = arr && arr.length ? arr.shift() : null; if (s) { reused.add(s.id); next.push({ id: s.id, ten: r.name }); } else next.push({ id: uid(), ten: r.name }); });
    purgeStudentData(S.students.filter(s => !reused.has(s.id)).map(s => s.id)); S.students = next;
  }
  const n = used.length; IMP = null; save(); render();
  toastUndo('Đã nhập ' + n + ' học sinh', () => restoreData(snap));
}

      <h3 style="margin-bottom:10px">${esc(m.name)} · ${hkName(hk)} · Tuần ${m.weeks[0]}–${m.weeks[m.weeks.length - 1]}</h3>
      ${noData ? '<p class="note" style="margin-bottom:12px">Chưa có tuần nào của tháng này được chốt. Hãy chốt tuần ở màn hình "Nhập tuần".</p>' : ''}
      <div class="table-wrap free"><table class="grid"><thead><tr><th class="c-stt">STT</th><th class="c-name">Họ và tên</th>${m.weeks.map(w => `<th>Tuần ${w}</th>`).join('')}<th>Điểm TB tháng</th><th>Xếp loại tháng</th><th class="l">Ghi chú</th></tr></thead>

function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function loadDemo() {
  const names = ['Nguyễn Minh Anh', 'Trần Gia Bảo', 'Lê Ngọc Châu', 'Phạm Đức Dũng', 'Hoàng Thu Hà', 'Vũ Quang Huy', 'Đặng Khánh Linh', 'Bùi Thanh Mai', 'Đỗ Hải Nam', 'Ngô Phương Thảo'];
  const keepSet = S.settings; S = newState(); S.settings = keepSet; rebuildCM();
  if (!S.settings.lop) S.settings.lop = '10A1'; if (!S.settings.truong) S.settings.truong = 'Trường THPT (dữ liệu mẫu)'; if (!S.settings.namHoc) S.settings.namHoc = '2026-2027';
  S.students = names.map(ten => ({ id: uid(), ten }));
  const rnd = mulberry(20261005), pick = p => rnd() < p;
  for (let w = 1; w <= 5; w++) {
    S.weeks['HK1-' + w] = { chot: w <= 4, e: {} };
    S.students.forEach((s, idx) => {
      const en = ensureEntry('HK1', w, s.id), add = (cid, n) => en.items.push({ cid, l: CM[cid].loai, n: n || 1, d: CM[cid].diem });
      const bad = idx === 3, good = idx === 4 || idx === 9;
      if (pick(good ? .03 : bad ? .9 : .4)) add('T1', 1 + Math.floor(rnd() * 3));
      if (pick(good ? .05 : .45)) add('T5', 1 + Math.floor(rnd() * 2));
      if (pick(.25)) add('T3'); if (pick(bad ? .8 : .3)) add('T7');
      if (pick(bad ? .5 : .08)) add('T4');
      if (bad && w >= 2 && w <= 3) { add('T6'); add('T2', 2); }
      if (idx === 1 && w === 3) add('T6');
      if (idx === 5 && w <= 4 && pick(.5)) add('T13');
      if (pick(.08)) add('T10');
      if (pick(good ? .5 : .1)) add('C1'); if (pick(good ? .5 : .12)) add('C2'); if (pick(good ? .6 : .15)) add('C3');
      if (idx === 0 && w === 2) add('C5');
      const has = id => en.items.some(i => i.cid === id);
      if (!has('T1') && !has('T2') && pick(.55)) add('C4');
      if (idx === 7 && !has('C7')) add('C7');
    });
  }
  S.ui.hk = 'HK1'; S.ui.week = 5; S.ui.view = 'dash'; save(); render(); toast('Đã nạp dữ liệu mẫu: 10 học sinh, 5 tuần (4 tuần đã chốt)');
}

const COPYRIGHT = 'Bản quyền thuộc về Thầy Tiến - GV Trường THPT Bỉm Sơn- Thanh Hóa';

/* ---- SHA-256 thuần JS (không phụ thuộc crypto.subtle nên chạy cả khi mở file trực tiếp) ---- */
function sha256(ascii) {

  for (let j = 0; j < words.length;) {

  title: 'Kích hoạt bản quyền',
  body: `<p>Nhập mật khẩu để dùng không giới hạn thời gian sau khi hết 30 ngày dùng thử.</p>
    <label class="f">Mật khẩu<input class="inp" id="licPwModal" type="password" autocomplete="off" placeholder="Nhập mật khẩu"></label>
    <p id="licMsgModal" class="lock-msg" role="alert" hidden></p><p class="hint">${esc(COPYRIGHT)}</p>`,
  actions: [{ label: 'Để sau', cls: 'ghost', fn: () => { } }, { label: 'Kích hoạt', cls: 'pri', fn: () => {
    const r = licTry($('#licPwModal').value);
    if (r === 'ok') { render(); toast('Đã kích hoạt, cảm ơn bạn đã sử dụng!'); return; }
    const m = $('#licMsgModal'); m.hidden = false; m.innerHTML = licMsgHTML(r); return false;
  } }]
});
ACT.licActivateSet = () => {
  const r = licTry($('#licPwSet').value);
  if (r === 'ok') { render(); toast('Đã kích hoạt, cảm ơn bạn đã sử dụng!'); return; }
  const m = $('#licMsgSet'); m.hidden = false; m.innerHTML = licMsgHTML(r);
};
</script>
</body>
